<mat-toolbar class="navbar" color="primary">
  <div class="navbar-content">
    <!-- Logo centrado -->
    <h1 class="logo">NEONVIBE</h1>

    <!-- Menú centrado -->
    <div class="nav-menu">
      <button mat-button [matMenuTriggerFor]="hombres">HOMBRES</button>
      <mat-menu #hombres="matMenu">
        <button mat-menu-item>Camisas</button>
        <button mat-menu-item>Pantalones</button>
        <button mat-menu-item>Zapatos</button>
      </mat-menu>

      <button mat-button [matMenuTriggerFor]="mujeres">MUJERES</button>
      <mat-menu #mujeres="matMenu">
        <button mat-menu-item>Vestidos</button>
        <button mat-menu-item>Blusas</button>
        <button mat-menu-item>Zapatos</button>
      </mat-menu>

      <button mat-button>ACCESORIOS</button>
      <button mat-button>OFERTAS</button>
      <button mat-button>MARCAS</button>
    </div>

    <!-- Íconos a la derecha -->
    <div class="icons">
      <button mat-icon-button aria-label="Carrito de compras">
        <mat-icon>shopping_cart</mat-icon>
      </button>
      <button mat-icon-button aria-label="Favoritos">
        <mat-icon>favorite</mat-icon>
      </button>
      <button mat-icon-button aria-label="Cuenta">
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>
