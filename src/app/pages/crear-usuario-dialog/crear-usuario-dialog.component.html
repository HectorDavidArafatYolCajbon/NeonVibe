<!-- Formulario de Crear Cuenta (Modal) -->
<div class="signup-container">
  <div class="signup-content">
    <!-- Botón de Cierre en la esquina superior derecha -->
    <button class="close-btn" (click)="closeDialog()">×</button>

    <!-- Imagen -->
    <div class="form-image"></div>

    <!-- Formulario -->
    <div class="form-content">
      <h2>Sign Up</h2>
      <form #signupForm="ngForm" (ngSubmit)="submitForm(signupForm)" novalidate>
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="fullName" ngModel required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" ngModel required />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" ngModel required />
        </div>

        <div class="form-group">
          <label for="nit">NIT (opcional)</label>
          <input type="text" id="nit" name="nit" ngModel />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" ngModel required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" ngModel required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Repeat Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            ngModel
            required
          />
        </div>

        <div class="form-check">
          <input type="checkbox" id="terms" name="terms" ngModel />
          <label for="terms">I agree to the Terms of User</label>
        </div>

        <button type="submit" [disabled]="!signupForm.valid">Sign Up</button>
      </form>
    </div>
  </div>
</div>
