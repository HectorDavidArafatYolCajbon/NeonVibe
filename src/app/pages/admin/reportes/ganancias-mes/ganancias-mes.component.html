<div class="ganancias-mes-container">
  <h2>Ganancias Totales por Mes</h2>

  <mat-card>
    <mat-card-content>
      <div *ngIf="cargando" class="loading-container">
        <mat-spinner diameter="40"></mat-spinner>
        <p>Cargando datos...</p>
      </div>

      <div *ngIf="error" class="error-container">
        <p class="error-message">{{error}}</p>
        <button mat-raised-button color="primary" (click)="cargarGananciasPorMes()">
          Reintentar
        </button>
      </div>

      <div *ngIf="!cargando && !error" class="chart-container">
        <canvas id="gananciasMesChart"></canvas>
      </div>
    </mat-card-content>
  </mat-card>
</div>
